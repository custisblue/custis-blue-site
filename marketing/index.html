<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Portfolio - Custis Donner</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/custisblue/custis-blue-assets/main/Heart_shaped_Logo_w_background.png">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://custisblue.com/marketing/">
    <meta property="og:title" content="Marketing Portfolio - Custis Donner">
    <meta property="og:description" content="Marketing & Content Professional with 50M+ TikTok views. Seeking entry-level role in brand, social, or community marketing.">
    <meta property="og:image" content="https://raw.githubusercontent.com/custisblue/custis-blue-assets/main/Marketing%20Portfolio%20(1).png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://custisblue.com/marketing/">
    <meta name="twitter:title" content="Marketing Portfolio - Custis Donner">
    <meta name="twitter:description" content="Marketing & Content Professional with 50M+ TikTok views. Seeking entry-level role in brand, social, or community marketing.">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/custisblue/custis-blue-assets/main/Marketing%20Portfolio%20(1).png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000 url('https://raw.githubusercontent.com/custisblue/custis-blue-assets/main/Black%20background.png') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
        }
        
        .portfolio-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 40px;
        }
        
        h1 {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: 600;
            text-align: center;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: #cccccc;
            text-align: center;
            margin-bottom: 50px;
            font-weight: 300;
        }
        
        .message-section {
            background: rgba(0, 255, 255, 0.05);
            border-left: 3px solid #00ffff;
            padding: 50px 40px;
            margin-bottom: 50px;
            border-radius: 4px;
            text-align: center;
        }
        
        .message-section h2 {
            font-size: 2rem;
            color: #00ffff;
            margin-bottom: 30px;
            font-weight: 600;
        }
        
        .message-section p {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 25px;
            line-height: 1.8;
        }
        
        .message-section p:last-child {
            margin-bottom: 0;
        }
        
        .message-section a {
            color: #00ffff;
            text-decoration: none;
            border-bottom: 1px solid rgba(0, 255, 255, 0.5);
            transition: border-bottom-color 0.3s ease;
        }
        
        .message-section a:hover {
            border-bottom-color: #00ffff;
        }
        
        .logo-link {
            display: inline-block;
            text-decoration: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
            margin: 40px auto 0;
            position: relative;
            text-align: center;
        }
        
        .logo-link:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }
        
        .logo-link img {
            height: 3.5vw;
            min-height: 35px;
            max-height: 70px;
            width: auto;
            filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.4));
        }
        
        .take-me-home-asset {
            position: absolute;
            bottom: -30px;
            right: -120px;
            height: 28px !important;
            max-height: 28px !important;
            min-height: 0px !important;
            width: auto !important;
            filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.4));
            pointer-events: none;
            opacity: 0;
            transform: rotate(-15deg) translateY(5px);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        
        .logo-link:hover .take-me-home-asset {
            opacity: 1;
            transform: rotate(-15deg) translateY(0);
            height: 28px !important;
            max-height: 28px !important;
        }
        
        /* Mobile blinking animation */
        @media (max-width: 768px) {
            .logo-link .take-me-home-asset,
            .take-me-home-asset {
                animation: blinkTakeMeHome 7s infinite;
                animation-delay: 3s;
                transition: opacity 1.5s ease-in-out;
                height: 24px !important;
                max-height: 24px !important;
                min-height: 0px !important;
                width: auto !important;
                bottom: -20px !important;
            }
        }
        
        @keyframes blinkTakeMeHome {
            0%, 2% {
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            52% {
                opacity: 1;
            }
            55%, 100% {
                opacity: 0;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }
            
            .portfolio-container {
                padding: 40px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .message-section {
                padding: 40px 25px;
            }
            
            .message-section h2 {
                font-size: 1.5rem;
            }
            
            .message-section p {
                font-size: 1rem;
            }
            
            .logo-link {
                display: block;
                text-align: center;
                position: relative;
            }
            
            .logo-link img {
                height: 9vw;
                min-height: 40px;
                max-height: 55px;
            }
            
            .logo-link .take-me-home-asset {
                height: 24px !important;
                max-height: 24px !important;
                min-height: 0px !important;
                width: auto !important;
                bottom: -20px !important;
                right: auto !important;
                left: calc(50% + 40px) !important;
                transform: translateX(-50%) rotate(-10deg) !important;
            }
            
            .logo-link:hover .take-me-home-asset {
                transform: translateX(-50%) rotate(-10deg) !important;
            }
            
            .take-me-home-asset {
                height: 24px !important;
                max-height: 24px !important;
                min-height: 0px !important;
            }
        }
    </style>
</head>
<body>
    <div class="portfolio-container">
        <h1>Marketing Portfolio</h1>
        
        <div class="message-section">
            <h2>Portfolio Under Construction</h2>
            <p>This portfolio is currently being updated. If you're interested in working together, please feel free to reach out via email at <a href="mailto:custisblue@gmail.com">custisblue@gmail.com</a>.</p>
            <p>In the meantime, feel free to explore my custom website by clicking the logo below.</p>
        </div>
        
        <div style="text-align: center;">
            <a href="/" class="logo-link">
                <img src="https://raw.githubusercontent.com/custisblue/custis-blue-assets/main/Heart_shaped_Logo_white.png" alt="CVSTIS BLUE Logo">
            </a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - CVSTIS BLUE</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/custisblue/custis-blue-assets/main/Heart_shaped_Logo_w_background.png">
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* Store page specific */
        body.store-page {
            background: #000 url('https://raw.githubusercontent.com/custisblue/custis-blue-assets/main/Black%20background.png') no-repeat center center;
            background-size: cover;
            min-height: 100vh;
        }
        .store-page .store-main {
            padding: 100px 24px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .store-page .store-intro {
            text-align: center;
            max-width: 560px;
            margin: 0 auto 40px;
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(0.9rem, 2.2vw, 1rem);
            line-height: 1.6;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
        }
        .store-page .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 60px;
        }
        @media (min-width: 900px) {
            .store-page .product-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 24px;
            }
        }
        .store-page .product-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .store-page .product-image {
            width: 100%;
            aspect-ratio: 1;
            display: block;
        }
        .store-page .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .store-page .product-image-link {
            text-decoration: none;
            cursor: pointer;
        }
        .store-page .product-image-link:hover img {
            transform: scale(1.05);
        }
        .store-page .product-image-link img {
            transition: transform 0.2s ease;
        }
        .store-page .buy-btn {
            display: inline-block;
            text-decoration: none;
            line-height: 0;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .store-page .buy-btn img {
            height: clamp(36px, 10vw, 56px);
            width: auto;
            display: block;
            filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.3));
        }
        .store-page .buy-btn:hover {
            transform: scale(1.05);
        }
        .store-page .buy-btn:hover img {
            filter: drop-shadow(0 0 12px rgba(0, 255, 255, 0.5));
        }
        .store-page .product-card.sold {
            position: relative;
        }
        .store-page .product-card.sold .product-image img,
        .store-page .product-card.sold .buy-btn img {
            filter: blur(8px);
        }
        .store-page .product-card.sold .sold-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            pointer-events: none;
        }
        .store-page .product-card.sold .sold-overlay span {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .store-page .product-card.sold .buy-btn {
            pointer-events: none;
            cursor: default;
        }
        .store-page .store-footer {
            text-align: center;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .store-page .logo-link {
            display: inline-block;
            text-decoration: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
            position: relative;
        }
        .store-page .logo-link:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }
        .store-page .logo-link img.logo-img {
            height: 3.5vw;
            min-height: 35px;
            max-height: 70px;
            width: auto;
            filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.4));
        }
        .store-page .take-me-home-asset {
            position: absolute;
            bottom: -30px;
            right: -120px;
            height: 28px !important;
            max-height: 28px !important;
            min-height: 0 !important;
            width: auto !important;
            filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.4));
            pointer-events: none;
            opacity: 0;
            transform: rotate(-15deg) translateY(5px);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .store-page .logo-link:hover .take-me-home-asset {
            opacity: 1;
            transform: rotate(-15deg) translateY(0);
        }
        @media (max-width: 768px) {
            .store-page .store-main { padding: 110px 16px 40px; }
            .store-page .store-title { margin-bottom: 28px; }
            .store-page .store-title-img { height: clamp(70px, 18vw, 140px); }
            .store-page .product-grid { margin-bottom: 28px; }
            .store-page .store-footer { padding-top: 8px; padding-bottom: 20px; }
            .store-page .logo-link img.logo-img {
                height: 9vw;
                min-height: 40px;
                max-height: 55px;
            }
            .store-page .logo-link .take-me-home-asset,
            .store-page .take-me-home-asset {
                animation: blinkTakeMeHome 7s infinite;
                animation-delay: 3s;
                transform: rotate(-10deg) !important;
                height: 24px !important;
                max-height: 24px !important;
                bottom: -35px !important;
            }
            .store-page .logo-link:hover .take-me-home-asset {
                transform: rotate(-10deg) !important;
            }
        }
        @keyframes blinkTakeMeHome {
            0%, 2% { opacity: 0; }
            5% { opacity: 1; }
            52% { opacity: 1; }
            55%, 100% { opacity: 0; }
        }
    </style>
</head>
